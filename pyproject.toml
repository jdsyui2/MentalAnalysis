[project]
name = "mental-analysis"
version = "3.2.1"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
topics = ["bertopic>=0.16,<1", "sentence-transformers>=3,<6", "jieba>=0.42", "umap-learn>=0.5", "hdbscan>=0.8"]
test = ["pytest>=8,<10"]
catalog = ["pandas>=2", "openpyxl>=3.1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "evaluation*", "configs*", "scripts*"]

[tool.setuptools.package-data]
configs = ["*.json"]

name: Contract tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test]' jieba ruff
      - run: python -m pytest -q
      - run: python -m ruff check core scripts evaluation run_pipeline.py build_conclusions.py tests --select F
